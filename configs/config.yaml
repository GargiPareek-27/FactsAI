# configs/config.yaml
# Data config
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  max_length: 512
  # Default changed from true to false: RoBERTa is a subword-tokenized
  # transformer that relies on natural sentence structure and function
  # words for its contextual embeddings. Stripping stopwords is a
  # bag-of-words-era technique that actively degrades transformer input
  # quality rather than helping it — it's left available (see
  # src/data_prep.py's remove_stopwords) for anyone who wants to compare,
  # but should not be the default preprocessing step for this model.
  clean_stopwords: false

# Model config
model:
  model_name: "roberta-base"
  num_labels: 2
  lstm_hidden_size: 256
  lstm_layers: 1
  dropout: 0.3
  use_attention: true

# Training config
training:
  epochs: 10
  batch_size: 16
  eval_batch_size: 32
  lr: 2.0e-5
  warmup_ratio: 0.1
  clip_grad_norm: 1.0
  mixed_precision: true
  early_stopping_patience: 3
  checkpoint_dir: "models/checkpoints"
  final_model_dir: "models/final_hybrid_roberta_bilstm"

# Logging / misc
logging:
  log_file: "train.log"
